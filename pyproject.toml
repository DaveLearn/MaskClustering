[project]
name = "maskclustering"
version = "0.1.0"
description = "MaskClustering class-agnostic 3D instance segmentation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "huggingface-hub>=0.34.0,<1",
    "networkx>=3.5,<4",
    "pyviz3d>=0.3.9,<0.6",
    "submitit>=1.5.3,<2",
    "timm>=1.0.22,<2",
    "tqdm>=4.67.1,<5",
    "tyro>=0.9.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.system-requirements]
cuda = "12.9"

[tool.pixi.dependencies]
python = "3.11.*"
cuda = "12.9.*"
cuda-version = "12.9.*"
cython = ">=3.1.3,<4"
cxx-compiler = ">=1.11.0,<2"
detectron2 = { version = "==0.6", build = "*cuda129py311*" }
git = ">=2.49.0,<3"
h5py = ">=3.14.0,<4"
make = ">=4.4.1,<5"
mmcv = { version = "==2.2.0", build = "*cuda129py311*" }
ninja = ">=1.13.0,<2"
numpy = "1.26.*"
open3d = ">=0.19.0,<0.20"
opencv = ">=4.11.0,<5"
pip = ">=25.2,<26"
pytorch = { version = "==2.10.0", build = "*cuda129_mkl_py311*" }
pytorch3d = { version = "==0.7.9", build = "*cuda129py311*" }
scikit-image = ">=0.25.2,<0.26"
scipy = ">=1.16.2,<2"
setuptools = ">=75,<82"
shapely = ">=2.1.2,<3"
torchvision = { version = "==0.26.0", build = "*cuda129_py311*" }
wheel = ">=0.47.0,<0.48"

[tool.pixi.pypi-dependencies]
psdframe = { path = "../../packages/psdframe", editable = true }
initializerdefs = { path = "../../packages/initializerdefs", editable = true }

[tool.pixi.pypi-options.dependency-overrides]
numpy = "<2.0"

[tool.pixi.tasks]
bootstrap_cropformer = "bash scripts/bootstrap_cropformer.sh"
build_cropformer_ops = { cmd = "bash scripts/build_cropformer_ops.sh", depends-on = ["bootstrap_cropformer"] }
download_cropformer_checkpoint = "python scripts/download_cropformer_checkpoint.py"
segment_external = "python segment.py"
predict_masks = { cmd = "bash scripts/run_maskclustering_task.sh predict", depends-on = ["build_cropformer_ops", "download_cropformer_checkpoint"] }
cluster = "bash scripts/run_maskclustering_task.sh cluster"
evaluate_class_agnostic = "bash scripts/run_maskclustering_task.sh evaluate"
class_agnostic_pipeline = { cmd = "bash scripts/run_maskclustering_task.sh pipeline", depends-on = ["build_cropformer_ops", "download_cropformer_checkpoint"] }
visualize = "bash scripts/run_maskclustering_task.sh visualize"
demo_cluster = "python main.py --config demo --seq_name_list scene0608_00 --debug"
demo_visualize = "python -m visualize.vis_scene --config demo --seq_name scene0608_00"
